[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitler"
version = "1.0.2"
description = "Transforma video ou audio em legendas prontas: SRT, VTT e TXT."
requires-python = ">=3.9"
dependencies = ["PySide6>=6.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
